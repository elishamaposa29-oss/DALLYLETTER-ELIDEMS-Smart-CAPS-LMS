name: Mobile Android Build and Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "artifacts/dallyletter-mobile/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

jobs:
  android-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://dallyletter-elidems-smart-caps-lms-4.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace TypeScript references
        run: pnpm run typecheck:libs
      - name: Typecheck mobile app
        run: pnpm --filter @workspace/dallyletter-mobile typecheck
      - name: Generate native Android project
        working-directory: artifacts/dallyletter-mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build reproducible debug APK
        working-directory: artifacts/dallyletter-mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Preserve first install package
        run: cp artifacts/dallyletter-mobile/android/app/build/outputs/apk/debug/app-debug.apk /tmp/dallyletter-v1.apk
      - name: Generate version 1.0.1 for upgrade test
        working-directory: artifacts/dallyletter-mobile
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); j.expo.version="1.0.1"; j.expo.android.versionCode=2; fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");'
          pnpm exec expo prebuild --platform android --no-install
      - name: Build update APK
        working-directory: artifacts/dallyletter-mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dallyletter-android-debug-apk
          path: artifacts/dallyletter-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Boot Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            diagnostics() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "::group::Android emulator diagnostics (failure status $status)"
                adb devices -l || true
                adb shell getprop sys.boot_completed || true
                adb shell getprop init.svc.bootanim || true
                adb shell dumpsys cpuinfo || true
                adb shell dumpsys meminfo || true
                adb logcat -d -t 4000 || true
                echo "::endgroup::"
              fi
              return "$status"
            }
            trap diagnostics EXIT

            adb wait-for-device
            timeout 300 sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
            test "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1"

            # Wait for Android's package manager to become responsive, not just boot_completed.
            ready=0
            for attempt in $(seq 1 24); do
              if adb shell cmd package list packages >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 5
            done
            test "$ready" = "1"
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb logcat -c

            # First install and launch must remain covered by the crash check.
            adb install /tmp/dallyletter-v1.apk
            adb shell pm path com.dallyletter.elidems | grep -q "package:"
            adb shell monkey -p com.dallyletter.elidems 1
            sleep 8
            if adb logcat -d -t 8000 | awk '/FATAL EXCEPTION/ { in_exception=1; count=0 } in_exception { if (/Process: com\.dallyletter\.elidems/) found=1; if (++count > 20) in_exception=0 } END { exit !found }'; then
              echo "Android app crashed after first install"
              exit 1
            fi

            # Upgrade the installed package in place; do not uninstall between versions.
            adb install -r artifacts/dallyletter-mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.dallyletter.elidems | grep -q "package:"
            adb shell dumpsys package com.dallyletter.elidems | grep -E "versionCode=2|versionName=1\.0\.1"
            adb shell monkey -p com.dallyletter.elidems 1
            sleep 8
            if adb logcat -d -t 8000 | awk '/FATAL EXCEPTION/ { in_exception=1; count=0 } in_exception { if (/Process: com\.dallyletter\.elidems/) found=1; if (++count > 20) in_exception=0 } END { exit !found }'; then
              echo "Android app crashed during upgrade smoke test"
              exit 1
            fi
