name: Mobile Android Build and Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "artifacts/dallyletter-mobile/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-android.yml"
      - ".github/scripts/android-emulator-smoke.sh"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://dallyletter-elidems-smart-caps-lms-4.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace TypeScript references
        run: pnpm run typecheck:libs
      - name: Typecheck mobile app
        run: pnpm --filter @workspace/dallyletter-mobile typecheck
      - name: Generate native Android project
        working-directory: artifacts/dallyletter-mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build reproducible debug APK
        working-directory: artifacts/dallyletter-mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Preserve first install package
        run: mkdir -p artifacts/dallyletter-mobile/apk-artifacts && cp artifacts/dallyletter-mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/dallyletter-mobile/apk-artifacts/dallyletter-v1.apk
      - name: Generate version 1.0.1 for upgrade test
        working-directory: artifacts/dallyletter-mobile
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); j.expo.version="1.0.1"; j.expo.android.versionCode=2; fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");'
          pnpm exec expo prebuild --platform android --no-install
      - name: Build update APK
        working-directory: artifacts/dallyletter-mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Preserve update package
        run: cp artifacts/dallyletter-mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/dallyletter-mobile/apk-artifacts/dallyletter-v1.0.1.apk
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dallyletter-android-debug-apk
          path: artifacts/dallyletter-mobile/apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://dallyletter-elidems-smart-caps-lms-4.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install emulator and Android 34 system image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          # Install only the host OS dependency; SDK-bundled libraries must be resolved from the SDK.
          sudo apt-get update
          sudo apt-get install --yes libpulse0
          test -x "$ANDROID_HOME/emulator/emulator"
          qemu_bin="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          test -x "$qemu_bin"
          emulator_root="$ANDROID_HOME/emulator"
          library_dirs=(
            "$emulator_root/lib64"
            "$emulator_root/lib64/qt/lib"
            "$emulator_root/lib64/gles_swiftshader"
            "$emulator_root/qemu/linux-x86_64"
            "$emulator_root/qemu/linux-x86_64/lib64"
          )
          sdk_library_path="$(IFS=:; echo "${library_dirs[*]}")"
          echo "$emulator_root" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk_library_path:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$sdk_library_path:${LD_LIBRARY_PATH:-}"
          echo "Android Emulator version:"
          "$emulator_root/emulator" -version
          echo "QEMU bundled library resolution with SDK library paths:"
          ldd "$qemu_bin" | tee /tmp/dallyletter-qemu-ldd.log
          missing="$(awk '/not found/ { print $1 }' /tmp/dallyletter-qemu-ldd.log)"
          if [ -n "$missing" ]; then
            echo "::error::QEMU still has unresolved libraries after adding Android SDK library directories: $missing"
            echo "SDK emulator directory tree:"
            find "$emulator_root" -maxdepth 4 -type f \( -name 'libandroid-emu-tracing.so' -o -name 'libQt6CoreAndroidEmu.so*' -o -name 'libc++.so' -o -name 'libprotobuf.so*' -o -name 'libtcmalloc_minimal.so*' \) -print
            exit 1
          fi
          # Exercise the supported launcher too; raw QEMU ldd alone does not validate emulator startup.
      - name: Create isolated Android virtual device
        run: |
          echo "no" | avdmanager create avd --force --name DallyletterSmoke --package "system-images;android-34;google_apis;x86_64" --device "pixel_2"
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: dallyletter-android-debug-apk
          path: /tmp/dallyletter-apks
      - name: Place APKs for smoke test
        run: |
          mkdir -p artifacts/dallyletter-mobile/android/app/build/outputs/apk/debug
          cp /tmp/dallyletter-apks/dallyletter-v1.apk /tmp/dallyletter-v1.apk
          cp /tmp/dallyletter-apks/dallyletter-v1.0.1.apk artifacts/dallyletter-mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Launch emulator and run install/launch/upgrade smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          if [ ! -x "$emulator_bin" ]; then
            echo "::error::Android emulator binary missing at $emulator_bin"
            find "$ANDROID_HOME" -maxdepth 3 -type f -name emulator -print || true
            exit 127
          fi
          "$emulator_bin" -avd DallyletterSmoke -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 2 -memory 3072 > /tmp/dallyletter-emulator.log 2>&1 &
          emulator_pid=$!
          diagnostics() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Emulator process diagnostics"
              adb devices -l || true
              adb get-state || true
              adb shell getprop sys.boot_completed || true
              adb shell getprop init.svc.bootanim || true
              tail -n 250 /tmp/dallyletter-emulator.log || true
              echo "::endgroup::"
            fi
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            exit "$status"
          }
          trap diagnostics EXIT
          bash .github/scripts/android-emulator-smoke.sh
