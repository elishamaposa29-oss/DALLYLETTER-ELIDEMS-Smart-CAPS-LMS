name: Dallyletter Real UI Showcase Capture

on:
  push:
    branches:
      - feat/public-seo-discovery-2026-11
  workflow_dispatch:
    inputs:
      site_url:
        description: Public Dallyletter website URL to capture
        required: true
        default: https://dallyletter-elidems-onlineschoolbye-two.vercel.app/

permissions:
  contents: read

jobs:
  capture:
    name: Capture real Dallyletter pages and role dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOWCASE_SITE_URL: ${{ inputs.site_url || 'https://dallyletter-elidems-onlineschoolbye-two.vercel.app/' }}
      SHOWCASE_LEARNER_EMAIL: ${{ secrets.SHOWCASE_LEARNER_EMAIL }}
      SHOWCASE_LEARNER_PASSWORD: ${{ secrets.SHOWCASE_LEARNER_PASSWORD }}
      SHOWCASE_TEACHER_EMAIL: ${{ secrets.SHOWCASE_TEACHER_EMAIL }}
      SHOWCASE_TEACHER_PASSWORD: ${{ secrets.SHOWCASE_TEACHER_PASSWORD }}
      SHOWCASE_MANAGER_EMAIL: ${{ secrets.SHOWCASE_MANAGER_EMAIL }}
      SHOWCASE_MANAGER_PASSWORD: ${{ secrets.SHOWCASE_MANAGER_PASSWORD }}
      SHOWCASE_OWNER_EMAIL: ${{ secrets.SHOWCASE_OWNER_EMAIL }}
      SHOWCASE_OWNER_PASSWORD: ${{ secrets.SHOWCASE_OWNER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser automation
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture public pages and configured demo dashboards
        run: node scripts/capture-dallyletter-showcase.mjs
      - name: Upload real UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dallyletter-real-ui-showcase
          path: showcase-captures/
          if-no-files-found: warn
          retention-days: 30
