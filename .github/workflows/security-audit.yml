name: Security Audit

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Weekly security audit
    - cron: '0 0 * * 0'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate || true

      - name: Verify minimum release age protection
        run: |
          grep -q "minimumReleaseAge: 1440" pnpm-workspace.yaml && echo "✓ Supply-chain protection enabled" || exit 1
