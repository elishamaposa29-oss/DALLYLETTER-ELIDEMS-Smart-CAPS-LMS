name: Google Search Console Performance Report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gsc-performance-report.yml
      - scripts/google-search-console-api.mjs
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate 28-day performance and indexing report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://elishamaposa29-oss-dallyletter-elid-gamma.vercel.app/' }}
        run: node scripts/gsc-performance-report.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dallyletter-search-console-report
          path: seo-reports/*.md
          if-no-files-found: ignore
          retention-days: 90
