name: CI

on:
  push:
    branches: [main, staging, feat/system-sync-audit-repair]
  pull_request:
    branches: [main, staging, production]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release safety
        run: pnpm run ci:verify

      # Publish the exact legacy status context required by branch protection.
      # The status reflects this job's result and is attached to the PR head SHA.
      - name: Report required verify status
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_STATE: ${{ job.status }}
          VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const state = process.env.VERIFY_STATE === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.VERIFY_SHA,
              state,
              context: 'verify',
              description: state === 'success' ? 'CI verification passed' : 'CI verification failed'
            });
