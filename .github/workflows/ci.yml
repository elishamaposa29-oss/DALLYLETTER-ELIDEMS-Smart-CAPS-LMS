name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging, production]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release safety
        run: pnpm run ci:verify

      - name: Capture temporary CI diagnostic
        if: failure()
        continue-on-error: true
        run: |
          set +e
          pnpm run ci:verify > /tmp/dallyletter-ci.log 2>&1
          status=$?
          echo "CI_VERIFY_EXIT=$status" >> /tmp/dallyletter-ci.log
          exit 0

      - name: Publish temporary CI diagnostic to PR
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_FILE: /tmp/dallyletter-ci.log
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- dallyletter-ci-diagnostic -->";
            const log = fs.existsSync(process.env.DIAGNOSTIC_FILE)
              ? fs.readFileSync(process.env.DIAGNOSTIC_FILE, "utf8").slice(-12000)
              : "Diagnostic log was not created.";
            const body = `${marker}
            ### Temporary CI diagnostic
            \`\`\`text
            ${log}
            \`\`\`
            `;
            const { owner, repo } = context.repo;
            const issue = context.issue.number;
            if (!issue) return;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue, body });
            }
