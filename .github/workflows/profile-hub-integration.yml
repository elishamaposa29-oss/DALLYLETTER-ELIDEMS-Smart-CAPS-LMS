name: Profile Hub Staging-Equivalent Integration

on:
  pull_request:
    branches: [main, staging, production]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/dallyletter/**"
      - "artifacts/dallyletter-mobile/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/profile-hub-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-hub-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dallyletter_pr84_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dallyletter_pr84_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dallyletter_pr84_test
      NODE_ENV: test
      JWT_SECRET: pr84-ci-only-secret-not-for-deployment
      PORT: "4000"
      API_BASE_URL: http://127.0.0.1:4000
      MOCK_PROVIDER_MODE: test
      MOCK_PROVIDER_CAPTURE: /tmp/dallyletter-provider-capture.jsonl
      RESEND_API_KEY: pr84-ci-mock-key
      EMAIL_FROM: "Dallyletter CI <test@example.test>"
      PAYPAL_CLIENT_ID: pr84-ci-mock-client
      PAYPAL_CLIENT_SECRET: pr84-ci-mock-secret
      PAYPAL_WEBHOOK_ID: pr84-ci-mock-webhook
      PAYPAL_API_BASE: http://paypal.test
      GOOGLE_CLIENT_ID: pr84-ci-google-client-id
      TWILIO_ACCOUNT_SID: ACpr84ci
      TWILIO_AUTH_TOKEN: pr84-ci-mock-twilio-token
      TWILIO_FROM_NUMBER: "+15005550006"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs
      # Android build and typecheck are intentionally deferred per the PR owner's explicit release constraint.
      - name: Create schema in isolated ephemeral PostgreSQL
        run: pnpm run db:push
      - name: Build API
        run: pnpm --dir artifacts/api-server run build
      - name: Start API with isolated provider mocks
        shell: bash
        run: |
          set -Eeuo pipefail
          touch "$MOCK_PROVIDER_CAPTURE"
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/artifacts/api-server/scripts/test-provider-mocks.mjs"
          nohup pnpm --dir artifacts/api-server run start >/tmp/pr84-api.log 2>&1 &
          echo $! >/tmp/pr84-api.pid
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail "$API_BASE_URL/api/healthz" >/tmp/pr84-health.json; then
              cat /tmp/pr84-health.json
              break
            fi
            if ! kill -0 "$(cat /tmp/pr84-api.pid)" 2>/dev/null; then
              cat /tmp/pr84-api.log
              exit 1
            fi
            sleep 2
          done
          test -s /tmp/pr84-health.json
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/pr84-health.json","utf8"));if(v.status!=="ok")process.exit(1)'
      - name: Test schema discovery, authenticated enrollment, progress, OTP, queue and webhook signatures
        run: pnpm --dir lib/db run test:profile-hub-integration
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr84-profile-hub-integration-logs
          path: |
            /tmp/pr84-api.log
            /tmp/pr84-health.json
            /tmp/dallyletter-provider-capture.jsonl
          if-no-files-found: warn
          retention-days: 7
