# Mirrors the existing LMS-4 Render service. Do not Blueprint-sync this PR.
# Production deployment remains controlled by the existing Render service settings.
services:
  - type: web
    name: DALLYLETTER-ELIDEMS-Smart-CAPS-LMS-4
    env: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    rootDir: artifacts/api-server
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --dir scripts repair:messages-schema && pnpm --dir scripts seed:owner && pnpm --dir artifacts/api-server build
    startCommand: pnpm start
