services:
  - type: web
    name: DALLYLETTER-ELIDEMS-STAGING-PR84
    env: node
    plan: free
    branch: feat/profile-hub-secure-foundation
    autoDeploy: false
    rootDir: artifacts/api-server
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: CORS_ORIGINS
        value: https://dallyletter-web.onrender.com
  - type: web
    name: dallyletter-api-production
    env: node
    plan: starter
    branch: production
    autoDeploy: false
    rootDir: artifacts/api-server
    # Build artifacts only. Never run database writes or owner seeding during build.
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --dir artifacts/api-server build
    # Schema first, then additive migrations/repairs, then the idempotent owner bootstrap.
    preDeployCommand: cd ../.. && pnpm run db:push && pnpm --dir scripts run migrate:legacy-tables && pnpm --dir lib/db run migrate:manager-permissions && pnpm --dir lib/db run migrate:payment-transactions && pnpm --dir scripts run migrate:exercise-schema && pnpm --dir scripts run repair:messages-schema && pnpm --dir scripts run repair:connect-schema && pnpm --dir scripts run seed:owner
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://dallyletter-web.onrender.com,https://dallyletterelidemslearningplatforme-six.vercel.app
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OWNER_BOOTSTRAP_EMAIL
        value: elishamaposa430@gmail.com
      - key: OWNER_BOOTSTRAP_PASSWORD
        sync: false
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        sync: false
