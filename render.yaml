services:
  - type: web
    name: dallyletter-api-staging
    env: node
    plan: starter
    branch: staging
    autoDeploy: false
    rootDir: artifacts/api-server
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://dallyletter-web.onrender.com,https://your-frontend-domain.com
  - type: web
    name: dallyletter-api-production
    env: node
    plan: starter
    branch: main
    autoDeploy: false
    rootDir: artifacts/api-server
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --dir scripts repair:messages-schema && pnpm --dir scripts repair:connect-schema && pnpm --dir scripts seed:owner && pnpm --dir artifacts/api-server build
    preDeployCommand: cd ../.. && pnpm run db:push && pnpm --dir scripts migrate:exercise-schema
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://dallyletter-web.onrender.com,https://your-frontend-domain.com
      - key: MEDIA_S3_ENDPOINT
        sync: false
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_REGION
        value: auto
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
