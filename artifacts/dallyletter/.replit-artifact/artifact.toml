kind = "web"
previewPath = "/"
title = "DallyLetter Elidems"
version = "1.0.0"
id = "artifacts/dallyletter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23262

[services.development]
run = "pnpm --filter @workspace/dallyletter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dallyletter", "run", "build" ]
publicDir = "artifacts/dallyletter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23262"
BASE_PATH = "/"
